aid: fluentai
name: Fluent.ai
description: >-
  Fluent.ai is a Montreal-based speech recognition software company, founded in
  2015, that voice-enables the world's devices with embedded, offline voice AI.
  Its patented "speech-to-intent" technology maps a user's speech directly to
  their intended action using acoustic deep neural networks, with no
  speech-to-text transcription and no cloud connection required. The result is a
  small-footprint, private-by-design engine that runs fully on-device, is robust
  to noise, and works across languages and accents. Fluent.ai licenses two core
  products to OEMs and ODMs: Fluent.ai Air (Automatic Intent Recognition), an
  on-device command-recognition engine, and Fluent.ai Wakeword, a small-footprint
  wake-word / keyword-spotting solution. Target markets include smart-home
  devices, wearables and hearables (including True Wireless Stereo), and
  industrial IoT and robotics. The company distributes its technology as embedded
  SDKs and reference designs through hardware partnerships (e.g. Arm, Cadence
  Tensilica, Knowles) rather than a public cloud API. It is a portfolio company of
  500 Global.
